" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">simulation</text></g><g transform="translate(408.9795986146769 249.58318144509968) rotate(0 47.21996307373047 12.5)"><text x="0" y="17.619999999999997" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#e03131" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">simulation</text></g><g transform="translate(321.37654959104003 318.25505554331716) rotate(0 57.809959411621065 12.5)"><text x="0" y="17.619999999999997" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">my contract</text></g></svg>